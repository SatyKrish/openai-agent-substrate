<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1180" height="680" viewBox="0 0 1180 680" role="img" aria-labelledby="title description">
  <title id="title">Persistent agent with Kubernetes sandboxes</title>
  <desc id="description">A long-running OpenAI Agents SDK application runs outside Kubernetes and stores conversation history and saved sandbox sessions. Lifecycle calls go to the Substrate API. Shell and file requests go through kubectl ate proxy over mutual TLS to the router, then via the worker's atunnel to an Actor with its own workspace. The Agent Substrate node supervisor coordinates checkpoints and restores through RustFS.</desc>
