<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starter agent</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/app.css">
<script src="https://cdn.platform.openai.com/deployments/chatkit/chatkit.js" async></script>
<script type="module" src="/static/app.js"></script>
</head>
<body>
<header class="bar">
  <strong>Starter agent</strong>
  <span class="muted" id="model">model</span>
  <span class="muted" id="status">No workspace yet · the first message creates one</span>
  <button type="button" id="new-chat">New conversation</button>
</header>
<main>
  <section id="chat" aria-label="Conversation"><p id="chat-error" role="alert" hidden></p></section>
  <section id="panel" aria-label="Workspace files">
    <nav id="files" aria-label="Files"></nav>
    <p id="notice" class="notice" hidden></p>
    <div id="viewer"><p class="muted">The files the agent writes in output/ and work/ appear here after each turn.</p></div>
  </section>
</main>
</body>
</html>
