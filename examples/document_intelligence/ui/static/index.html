<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document Intelligence</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&amp;display=swap">
<link rel="stylesheet" href="/static/app.css">
<script src="https://cdn.platform.openai.com/deployments/chatkit/chatkit.js" async></script>
<script type="module" src="/static/app.js"></script>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M9 13h6"/><path d="M9 17h4"/></svg>
    <span class="brand-name">Document Intelligence</span>
    <span class="brand-sep" aria-hidden="true">/</span>
    <span class="brand-thread" id="thread-title">New analysis</span>
  </div>
  <div class="topbar-actions">
    <span class="chip"><span class="dot dot-accent"></span><span id="model-name">model</span></span>
    <span class="chip chip-mono" id="cluster-name">cluster</span>
    <a class="link-button" id="jaeger-link" href="#" target="_blank" rel="noopener noreferrer" hidden>Jaeger
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
    </a>
    <div class="segmented" role="group" aria-label="Appearance">
      <button type="button" data-theme-choice="system" aria-label="Follow the system appearance">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8"/><path d="M12 16v4"/></svg>System</button>
      <button type="button" data-theme-choice="light" aria-label="Light appearance">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Light</button>
      <button type="button" data-theme-choice="dark" aria-label="Dark appearance">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>Dark</button>
    </div>
    <button type="button" class="primary" id="new-analysis">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New analysis</button>
  </div>
</header>

<main class="workspace">
  <section class="pane chat-pane" aria-label="Conversation">
    <div id="chat-host" class="chat-host"></div>
    <p class="chat-error" id="chat-error" role="alert" hidden></p>
    <div class="workspace-status" id="workspace-status" aria-live="polite">
      <span class="dot" id="workspace-dot"></span>
      <span id="workspace-text">No workspace yet · the first message creates an Actor</span>
    </div>
  </section>

  <section class="pane artifact-pane" aria-label="Artifact">
    <div class="artifact-head">
      <div class="artifact-title">
        <h2 id="artifact-title">Workspace files</h2>
        <span class="mono muted" id="artifact-sub">Outputs and traces for each turn appear here</span>
      </div>
      <div class="artifact-actions">
        <label class="visually-hidden" for="turn-select">Turn</label>
        <select id="turn-select" disabled></select>
        <a class="icon-button" id="download-link" href="#" aria-label="Download this file" hidden>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12"/><path d="m7 11 5 5 5-5"/><path d="M5 20h14"/></svg>
        </a>
      </div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Artifact views"></nav>
    <div class="artifact-body" id="artifact-body"></div>
  </section>
</main>
</body>
</html>
