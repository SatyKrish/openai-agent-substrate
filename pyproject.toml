[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "openai-agent-substrate"
version = "0.1.0"
description = "Reference implementation of a Kubernetes sandbox provider for the OpenAI Agents SDK using Agent Substrate"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "third_party/substrate-sandbox/LICENSE", "examples/document_intelligence/agent/sandbox/workspace/inputs/LICENSE"]
keywords = ["openai", "agents", "kubernetes", "sandbox", "agent-substrate"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "openai-agents==0.24.0",
    "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
    "opentelemetry-sdk>=1.39,<2",
]

[project.urls]
Homepage = "https://github.com/SatyKrish/openai-agent-substrate"
Documentation = "https://github.com/SatyKrish/openai-agent-substrate/tree/main/docs"
Repository = "https://github.com/SatyKrish/openai-agent-substrate"
Issues = "https://github.com/SatyKrish/openai-agent-substrate/issues"

[project.scripts]
openai-agent-substrate = "openai_agent_substrate.demo:main"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.17.3",
    "twine>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "examples/document_intelligence/evals"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F"]

[tool.mypy]
python_version = "3.11"
follow_imports = "silent"
files = ["src/openai_agent_substrate/transport.py", "src/openai_agent_substrate/proxy.py", "src/openai_agent_substrate/lifecycle.py"]
