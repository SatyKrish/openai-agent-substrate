# Workspace root: no package of its own. The provider library is sandbox/, the
# shared agent harness is harness/, and the agents in examples/ run from here.
[tool.uv.workspace]
members = ["sandbox", "harness"]

[tool.uv.sources]
openai-agent-substrate = { workspace = true }
openai-harness = { workspace = true }

[dependency-groups]
dev = [
    "openai-agent-substrate[tracing]",
    "mypy>=2.4.1",
    "pytest>=9.2,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.17.3",
    "twine>=6,<7",
]
# The harness and its ChatKit UI dependencies, for the agent UIs and their tests.
ui = [
    "openai-harness",
]

[tool.pytest.ini_options]
testpaths = ["tests", "sandbox/tests", "harness/tests", "examples/document_intelligence/evals", "examples/sre/evals", "examples/starter/evals", "examples/provider_check/evals"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F"]

[tool.mypy]
python_version = "3.11"
follow_imports = "silent"
files = ["sandbox/src/agent_substrate/transport.py", "sandbox/src/agent_substrate/proxy.py", "sandbox/src/agent_substrate/lifecycle.py"]
