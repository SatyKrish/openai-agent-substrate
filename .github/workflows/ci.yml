name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      kubernetes:
        description: Run the opt-in Kind/Substrate integration job
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.7"
          python-version: ${{ matrix.python }}
      - name: Install locked dependencies
        run: uv sync --locked --group ui
      - name: Lint Python sources
        run: uv run --locked ruff check src scripts deploy examples tests conftest.py
      - name: Type-check transport, proxy, and lifecycle contracts
        run: uv run --locked mypy
      - name: Run unit and integration tests
        run: uv run --locked pytest -q
      - name: Run the key-free demo
        run: uv run --locked python -m examples.quickstart --backend local
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: false
      - name: Build the upstream execution server
        run: go build -o artifacts/upstream-sandbox-server third_party/substrate-sandbox/main.go
      - name: Verify upstream protocol compatibility
        run: uv run --locked pytest -q tests/integration examples/document_intelligence/evals/test_workflow.py examples/document_intelligence/evals/test_ui.py
        env:
          SUBSTRATE_DEMO_BINARY: ${{ github.workspace }}/artifacts/upstream-sandbox-server

  package:
    name: Package distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.7"
          python-version: "3.14"
      - name: Install locked development tools
        run: uv sync --locked
      - name: Build wheel and source distribution
        run: uv build --no-sources
      - name: Verify base wheel without tracing dependencies
        run: |
          uv venv /tmp/provider-core-env
          uv pip install --python /tmp/provider-core-env/bin/python dist/*.whl
          /tmp/provider-core-env/bin/python -I tests/packaging/core_smoke.py
      - name: Validate distribution metadata
        run: uv run --locked twine check dist/*

  kubernetes:
    name: Kubernetes integration (opt-in)
    if: github.event_name == 'workflow_dispatch' && inputs.kubernetes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.7"
          python-version: "3.14"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: false
      - name: Configure a key-free harness
        run: cp .env.example .env
      - name: Set up Kind and Substrate
        run: ./scripts/local-kubernetes.sh setup
      - name: Verify provider on Kubernetes
        run: ./scripts/local-kubernetes.sh test
      - name: Prepare the harness and verify the document workflow
        run: |
          ./scripts/local-kubernetes.sh agent-setup
          ./scripts/local-kubernetes.sh agent-test
      - name: Run Secret-mounted harness integration test
        run: |
          export PATH="$PWD/artifacts/local/bin:$PATH"
          export SUBSTRATE_DOCUMENT_TEMPLATE="$(uv run --locked python -c 'import json; print(json.load(open("artifacts/examples/document_intelligence/deployment/deployment.json"))["template"])')"
          uv run --locked pytest -q examples/document_intelligence/evals/kubernetes/test_agent_configuration.py examples/document_intelligence/evals/kubernetes/test_document_intelligence.py
        env:
          SUBSTRATE_RUN_AGENT_POD_TESTS: "1"
          SUBSTRATE_RUN_KUBERNETES_TESTS: "1"
          SUBSTRATE_KUBE_CONTEXT: kind-openai-agent-substrate
          SUBSTRATE_KUBECONFIG: ${{ github.workspace }}/artifacts/local/kubeconfig
      - name: Verify Jaeger SDK and sandbox tracing
        run: |
          ./scripts/local-kubernetes.sh tracing-setup
          kubectl --context "$SUBSTRATE_KUBE_CONTEXT" --kubeconfig artifacts/local/kubeconfig -n openai-agent-substrate port-forward service/jaeger-all-in-one 16686:16686 --address=127.0.0.1 > artifacts/local/jaeger-port-forward.log 2>&1 &
          jaeger_forward_pid=$!
          trap 'kill "$jaeger_forward_pid"' EXIT
          export SUBSTRATE_DOCUMENT_TEMPLATE="$(uv run --locked python -c 'import json; print(json.load(open("artifacts/examples/document_intelligence/deployment/deployment.json"))["template"])')"
          uv run --locked pytest -q examples/document_intelligence/evals/kubernetes/test_jaeger_tracing.py
        env:
          SUBSTRATE_RUN_JAEGER_TESTS: "1"
          SUBSTRATE_KUBE_CONTEXT: kind-openai-agent-substrate
          SUBSTRATE_KUBECONFIG: ${{ github.workspace }}/artifacts/local/kubeconfig
      - name: Verify artifact collection
        run: ./scripts/local-kubernetes.sh agent-artifacts
