name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.7"
          python-version: ${{ matrix.python }}
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run unit and integration tests
        run: uv run --locked pytest -q
      - name: Run the key-free demo
        run: uv run --locked openai-agent-substrate
      - name: Build the upstream execution server
        run: go build -o artifacts/upstream-sandbox-server third_party/substrate-sandbox/main.go
      - name: Verify upstream protocol compatibility
        run: uv run --locked pytest -q
        env:
          SUBSTRATE_DEMO_BINARY: ${{ github.workspace }}/artifacts/upstream-sandbox-server

  package:
    name: Package distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.7"
          python-version: "3.14"
      - name: Install locked development tools
        run: uv sync --locked
      - name: Build wheel and source distribution
        run: uv build --no-sources
      - name: Validate distribution metadata
        run: uv run --locked twine check dist/*
